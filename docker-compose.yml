version: '3.8'

services:
  fhem-mcp:
    image: ghcr.io/jbkunama1/hai.mcp-fhem-server/fhem-mcp:latest
    container_name: fhem-mcp
    restart: unless-stopped
    environment:
      - MCP_API_KEY=${MCP_API_KEY:?MCP_API_KEY environment variable is required}
      - FHEM_URL=${FHEM_URL:?FHEM_URL environment variable is required}
      # Optional: "user:password" (Basic Auth) or bearer token for the default FHEM instance
      - FHEM_AUTH=${FHEM_AUTH:-}
      # Optional: comma-separated extra Host headers for the MCP DNS rebinding protection
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-}
      # Optional: set to "false" to disable the MCP DNS rebinding protection entirely
      - MCP_DNS_REBINDING_PROTECTION=${MCP_DNS_REBINDING_PROTECTION:-}
    ports:
      - "5887:8000"
    networks:
      - highfishNetwork

networks:
  highfishNetwork:
    external: true
